name: rewe
version: "0.1.0"
config-version: 2
profile: rewe

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "logs"]

# Run dbt from the project root (paths below are relative to it):
#   uv run dbt build --project-dir transform --profiles-dir transform
vars:
  bronze_glob: "data/bronze/prices/*.parquet"

  # Cross-cutting / promotional categories. A product is listed here *in addition*
  # to its real department, so they are never used as a product's primary category.
  thematic_categories: ["Monats-Highlights", "Grillsaison", "Regional", "Bewusste Ernährung"]

  # A product may be missing from a few snapshots although it was still sold
  # (the source scrapes page by page). Gaps up to this many snapshots do not
  # break a price interval.
  max_gap_snapshots: 3

  # A snapshot with fewer products than this share of the surrounding median
  # is flagged as partial (incomplete scrape).
  partial_snapshot_threshold: 0.85

  # Allowed relative difference between our computed unit price and the one
  # printed in the source, used by the parser test.
  unit_price_tolerance: 0.03

  # Largest acceptable share of price intervals whose unit price still conflicts
  # with the printed one after reconciliation (0.005 = 0.5%).
  unit_price_conflict_max_share: 0.005

  # Month-to-month price ratios outside [1/x, x] are treated as data errors and
  # left out of the price index.
  index_max_monthly_ratio: 3

  # Categories averaging fewer products per monthly comparison are left out of
  # the index (seasonal and promotional categories are too small to be stable).
  index_min_products: 50

  # A pack is "smaller" for shrinkflation when its content drops by at least this
  # share. Drops above the max share are almost always typos in the source
  # (1000kg instead of 1000g, 1ml instead of 1l) and are left out.
  shrinkflation_min_content_drop: 0.03
  shrinkflation_max_content_drop: 0.5

models:
  rewe:
    staging:
      +schema: staging
      +materialized: view
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

version: 2

models:
  - name: silver_product_daily
    description: One row per (snapshot_date, region, gtin). Category repeats collapsed into a list.
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, region, gtin]
    columns:
      - name: distinct_prices
        description: Number of different prices among a product's category repeats. Must be 1.
        data_tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false

  - name: silver_grammage
    description: Parsed pack size and unit price for every distinct grammage string.
    columns:
      - name: grammage
        data_tests: [unique, not_null]

  - name: silver_pack_measure
    description: >
      Final pack measure per (grammage, name, price), reconciled with the size in
      the product name and the unit price printed in the source.
    data_tests:
      - unique_combination:
          arguments:
            columns: [grammage, name, price]
    columns:
      - name: unit_price_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [match, multipack_total, from_name, conflict, unverified]

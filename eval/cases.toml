# Evaluation set for the assistant. Run: uv run python -m app.evaluate --providers groq
#
# Each case has a question and checks; a case passes when all its checks pass.
#   tools        the assistant must call at least one of these tools
#   args         expected arguments of the first call of that tool (subset, case-insensitive)
#   numbers      every number must appear in the answer (small rounding allowed);
#                a list inside the list means "any of these", e.g. [3.33, 103.33]
#   mentions     every text must appear in the answer (case and accents ignored)
#   mentions_any at least one of these texts must appear
#   not_mentions none of these texts may appear
#   max_chars    the answer must not be longer than this
#   no_tools     true: the assistant must answer without calling any tool
#
# Expected values come from the data (snapshots 2023-11-15 to 2025-09-09). Rebuild
# them when the data or the marts change.

# --- current prices ----------------------------------------------------------

[[case]]
id = "price_nutella_750_de"
question = "Was kostet Nutella 750g in Bayern?"
